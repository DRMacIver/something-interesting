<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two Types of Things</title>
    <meta
      name="description"
      content="Make your own &quot;Calvin's dad explains there are two types of things&quot; meme."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Two Types of Things</h1>
      <p>Calvin's dad has a theory. Write it, and he'll explain it.</p>
    </header>

    <main>
      <section class="editor" aria-label="Meme text">
        <label class="panel-text">
          <span>Panel 1: Dad</span>
          <textarea id="text1" rows="2" spellcheck="true"></textarea>
        </label>
        <label class="panel-text">
          <span>Panel 2: Dad</span>
          <textarea id="text2" rows="6" spellcheck="true"></textarea>
        </label>
        <label class="panel-text">
          <span>Panel 2: Calvin</span>
          <textarea id="text4" rows="1" spellcheck="true"></textarea>
        </label>
        <label class="panel-text">
          <span>Panel 3: Dad</span>
          <textarea id="text3" rows="6" spellcheck="true"></textarea>
        </label>

        <div class="actions">
          <button id="download" type="button" class="primary">Download PNG</button>
          <button id="copy-image" type="button">Copy image</button>
          <button id="copy-link" type="button">Copy link</button>
          <button id="reset" type="button">Reset</button>
        </div>
        <p id="status" role="status"></p>
      </section>

      <section class="preview" aria-label="Preview">
        <canvas id="canvas" aria-label="The generated comic"></canvas>
      </section>
    </main>

    <footer>
      <p>
        Artwork from <i>Calvin and Hobbes</i> by Bill Watterson, 5 June 1990.
        This page runs entirely in your browser.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
