          if (['historical-math-symbols','new-music-symbols'].includes(name)) knownLimitations.push('Standalone symbols preserve source distinctions and advances with light pen variation. New combining music marks, full notation layout and specialist/style review remain pending.');
          if (['legacy-constructed','legacy-pictures'].includes(name)) knownLimitations.push('Pinned native legacy symbol identities and connecting cells are retained; standalone outlines have light pen variation. Exhaustive historical-reference and comic-style review remain pending.');
          if (name==='egyptian-modified-insertions') knownLimitations.push('467 mirrored, 24 registered rotated and 24 rotated/mirrored source templates retain native artwork and source/documented positions. Source-specific overlap and broader style review remain provisional.');
          if (['egyptian-insertions','egyptian-multiple-insertions','egyptian-native-region-overlaps','egyptian-mirror-helpers','egyptian-native-mirror-alternates','egyptian-documented-cells'].includes(name)) knownLimitations.push('All 982 enumerated native insertion templates are recovered; 65 explicit mirror helpers become sign reflections and four missing size rules use documented native cells. Earlier 910 templates are unchanged. Source overlap observations are not a claim of collision freedom or linguistic validation; style review remains open.');
          if (name === 'egyptian-damage') knownLimitations.push('All fifteen damage masks work on individual signs and matched insertion containers, including rotated/mirrored signs and enclosed groups. Broader source-style review remains open.');
          if (name === 'egyptian-editorial') knownLimitations.push('Blank spacing and lost-sign shading, including expanded variants, use the shared layout path; broader editorial typography remains pending.');
          if (name === 'egyptian-mirrors') knownLimitations.push('Explicit horizontal mirroring is applied after registered rotations before directional reflection; custom styling and advanced control interactions remain pending.');
          if (name === 'egyptian-rotations') knownLimitations.push('Registered rotations use affine native outlines and work in basic quadrats; advanced controls and custom style remain pending.');
          if (name === 'supplemental-script-forms') knownLimitations.push('Khitan is shown as separate horizontal characters; cluster arrangement and vertical orientation remain unimplemented. U+18CFF is intentionally a hollow square indicating a lost character.');
          if (report.emojiFallbacks.length) knownLimitations.push('Listed emoji fallbacks use native system artwork; their custom drawing/sequence coverage remains incomplete.');
          const typography = ['egyptian-enclosure-ends', 'hieroglyphs', 'egyptian-composition', 'calvin-wide-cluster', 'grid-wide'].includes(name)
            ? {cap:report.cap, fontSize:report.fontSize, lines:report.panels.flatMap(p => p.speeches.flatMap(s => s.lines.map(l => ({text:l.text,fontSize:l.fontSize,x:l.x,y:l.y,width:l.width,height:l.height,ink:l.ink}))))} : undefined;
          const geometryDetails=geometry.length ? {cap:report.cap,panels:report.panels.map(p=>({width:p.panel.width,height:p.panel.height,speeches:p.speeches.map(s=>({who:s.who,lines:s.lines.map(({x,y,width,height})=>({x,y,width,height}))}))}))} : undefined;
          results.push({ name, renderMs, emojiFallbacks:report.emojiFallbacks, pngBytes: png?.size, knownLimitations, bundledScriptFonts: report.loadedFontFamilies.length, unmappedCodepoints: report.unmappedCodepoints, lines: count, canvas: [canvas.width, canvas.height], typography, failures, geometry, geometryDetails });
        }
        summary.textContent = JSON.stringify({ fontLoaded: document.fonts.check('20px "Dad Lettering"'), results }, null, 2);
        document.title = results.some(r => r.failures.length) ? "FAIL: Unicode rendering checks"
          : results.some(r => r.geometry.length) ? "REVIEW: Unicode balloon geometry"
          : "PASS geometry/export: typography review pending";
      } catch (error) {
        summary.textContent = String(error.stack ?? error);
        document.title = "ERROR: Unicode rendering checks";
      }
    </script>
