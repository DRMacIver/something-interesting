<script type="module">
import {loadComic,renderComic} from '../js/comic.js';
import {loadTextFonts} from '../js/fonts.js';
const rows=['🤔 😂 😭 🔬 🎻 🐈 🌷','👩🏽‍🍼 🤰🏽 👮🏽 👩🏽‍🔬','❤️ 💙 🟢 🍎 👍🏽 🥒'];
await loadTextFonts(rows);
let results=[];
for(const [i,text] of rows.entries()) {
 const canvas=document.createElement('canvas');canvas.width=1050;canvas.height=90;document.querySelector('main').append(canvas);
 const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1050,90);ctx.fillStyle='#111';ctx.strokeStyle='#111';ctx.lineJoin='round';
 for(let c=0;c<3;c++) {const size=24*(c?1.4:1);ctx.font=`${size}px "Dad Emoji"`;ctx.fillText(text,10+c*350,53);if(c===2){const before=ctx.getImageData(700,0,350,90).data;ctx.lineWidth=size*.018;ctx.font=`${size}px "Dad Emoji Ink"`;ctx.strokeText(text,710,53);const after=ctx.getImageData(700,0,350,90).data;let changed=0;for(let n=0;n<after.length;n+=4)if(after[n]!==before[n]||after[n+1]!==before[n+1]||after[n+2]!==before[n+2])changed++;results.push({row:i,strokeChangedPixels:changed});}}
}
document.querySelector('pre').textContent=JSON.stringify(results,null,2);
const heading=document.createElement('h2');heading.textContent='In the comic';heading.id='comic';document.body.append(heading);
const strip=document.createElement('canvas');strip.style.width='min(800px,95vw)';strip.style.height='auto';document.body.append(strip);
await renderComic(strip,await loadComic('../'),['Dad, why does this happen? 🤔','Science. 🔬','That explains everything. 😂','Even this? 👩🏽‍🍼 🥒 🎻']);
</script>
