<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lettering Checks</title>
    <link rel="stylesheet" href="../style.css?v=b27b0e92ba" />
    <style>
      body {
        padding: 16px;
      }
      .scenario {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .scenario canvas {
        width: 360px;
        height: auto;
        background: #fff;
      }
      .scenario h2 {
        margin: 0 0 4px;
        font-size: 1rem;
      }
      .scenario.ok h2::after {
        content: " ✓";
        color: green;
      }
      .scenario.bad h2::after {
        content: " ✗";
        color: var(--accent);
      }
      .scenario ul {
        margin: 0;
        padding-left: 18px;
        font-size: 0.9rem;
      }
      #summary {
        font-weight: 600;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "../js/app.js": "../js/app.js?v=1089b94d57",
          "../js/balloon.js": "../js/balloon.js?v=3f9519a6b5",
          "../js/checks.js": "../js/checks.js?v=9a06bf4caf",
          "../js/clipboard.js": "../js/clipboard.js?v=c7602cc6de",
          "../js/comic.js": "../js/comic.js?v=75692baa46",
          "../js/layout.js": "../js/layout.js?v=473097137d"
        }
      }
    </script>
  </head>
  <body>
    <h1>Lettering checks</h1>
    <p>
      The comic drawn with texts of many lengths, each checked for whether its
      lettering looks reasonable (see <code>js/checks.js</code>).
    </p>
    <p id="summary">Running…</p>
    <div id="results"></div>

    <script type="module">
      import { DEFAULTS, drawComic, loadComic } from "../js/comic.js";
      import { checkComic } from "../js/checks.js";

      const SAMPLE =
        "every point on the record goes round once a minute but the ones near " +
        "the edge have much further to go so they have to move faster which is " +
        "why it all sounds the same from the outside of the record to the label " +
        "in the middle even though it really shouldn't if you think about it for " +
        "long enough and I have thought about it a great deal more than you";
      const words = (n) => {
        const text = SAMPLE.split(" ").slice(0, n).join(" ");
        return text[0].toUpperCase() + text.slice(1) + ".";
      };
      const SIZES = [1, 3, 8, 16, 30, 60];
      const SLOTS = ["panel 1", "panel 2", "panel 3", "Calvin"];

      const scenarios = [];
      for (const [slot, name] of SLOTS.entries()) {
        for (const n of slot === 3 ? SIZES.slice(0, 5) : SIZES) {
          const texts = [...DEFAULTS];
          texts[slot] = words(n);
          scenarios.push({ name: `${name}: ${n} words`, texts });
        }
      }
      for (const n of SIZES) {
        scenarios.push({ name: `everything: ${n} words`, texts: [0, 1, 2, 3].map(() => words(Math.min(n, 30))) });
      }
      scenarios.push({ name: "defaults", texts: [...DEFAULTS] });
      // A wall of short lines, which don't get any shorter for more width.
      const BEE =
        "According to all known laws of aviation, there is no way a bee should be able to fly.\n" +
        "Its wings are too small to get its fat little body off the ground.\n" +
        "The bee, of course, flies anyway because bees don't care what humans think is impossible.\n" +
        "Yellow, black. Yellow, black. Yellow, black. Yellow, black.\nOoh, black and yellow!\n" +
        "Let's shake it up a little.\nBarry! Breakfast is ready!\nComing!\nHang on a second.\n" +
        "Hello?\nBarry?\nAdam?\nCan you believe this is happening?\nI can't.\nI'll pick you up.\n" +
        "Looking sharp.\nUse the stairs, your father paid good money for those.\n" +
        "Sorry. I'm excited.\nHere's the graduate.";
      for (const [slot, name] of SLOTS.slice(0, 3).entries()) {
        const texts = [...DEFAULTS];
        texts[slot] = BEE;
        scenarios.push({ name: `${name}: bee movie`, texts });
      }

      const only = new URLSearchParams(location.search).get("only");
      const comic = await loadComic("../");
      const results = [];
      for (const scenario of scenarios) {
        if (only && scenario.name !== only) continue;
        const canvas = document.createElement("canvas");
        const report = drawComic(canvas, comic, scenario.texts);
        const problems = checkComic(report);
        results.push({ name: scenario.name, problems });

        const section = document.createElement("section");
        section.className = "scenario " + (problems.length ? "bad" : "ok");
        if (only) {
          section.style.gridTemplateColumns = "1fr";
          canvas.style.width = "100%";
        }
        const info = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = scenario.name;
        const list = document.createElement("ul");
        for (const p of problems) {
          const item = document.createElement("li");
          item.textContent = `panel ${p.panel} ${p.who}: ${p.check}: ${p.detail}`;
          list.append(item);
        }
        info.append(title, list);
        section.append(canvas, info);
        document.getElementById("results").append(section);
      }
      const failed = results.filter((r) => r.problems.length);
      document.getElementById("summary").textContent =
        `${results.length - failed.length} of ${results.length} scenarios pass.`;
      window.checkResults = results;
    </script>
  </body>
</html>
