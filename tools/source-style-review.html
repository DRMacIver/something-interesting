<body>
  <header><h1>Source lettering style review</h1><nav><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav><a id="download" download="source-style.png">Download page PNG</a></header>
  <p>22 px dialogue and 44 px detail beside original Dad lettering. Glyph studies are not translations. This sheet does not establish linguistic correctness.</p>
  <p id="summary">Loading source specimens…</p>
  <canvas id="atlas" aria-label="Native source lettering specimens"></canvas>
  <script type="module">
    import {paragraphDirection} from '../js/direction.js';
    import {nativeShapingText} from '../js/native-shaping.js';
    import {graphemes} from '../js/unicode.js';
    const data=await (await fetch('../output/font-review/source-style-atlas.json',{cache:'no-store'})).json();
    const perPage=12,total=Math.ceil(data.samples.length/perPage),params=new URLSearchParams(location.search);
    let page=Math.max(0,Math.min(total-1,Number(params.get('page'))||0));
    const canvas=document.querySelector('#atlas'),ctx=canvas.getContext('2d'),loaded=new Map();
    const dad=await new FontFace('Review Dad','url(../assets/fonts/dad-lettering-unicode.woff2)').load();document.fonts.add(dad);
    async function draw(){
      document.querySelector('#summary').textContent='Loading source specimens…';
      const rows=data.samples.slice(page*perPage,(page+1)*perPage),errors=[];
      await Promise.all(rows.flatMap(r=>r.fonts).map(async f=>{
        if(!loaded.has(f.family))loaded.set(f.family,new FontFace(f.family,`url(../${f.file}?v=${f.sha256.slice(0,10)})`).load().then(face=>document.fonts.add(face)).catch(e=>{errors.push(f.family);throw e;}));
        await loaded.get(f.family);
      }));
      // Reserve painted bounds, including native stacking and overhang. Fixed
      // rows hid descenders and Khitan clusters under the following caption.
      const specimens=rows.map(row=>{
        const family=row.fonts.map(f=>JSON.stringify(f.family)).join(',');
        const line=size=>{
          ctx.font=`${size}px ${family}`;ctx.direction=paragraphDirection(row.text);ctx.textAlign='left';
          let text=row.text,metrics=ctx.measureText(nativeShapingText(text));
          const width=m=>Math.max(m.width,m.actualBoundingBoxRight)+Math.max(0,m.actualBoundingBoxLeft);
          while(graphemes(text).length>1&&width(metrics)>950){
            text=graphemes(text).slice(0,-1).join('');metrics=ctx.measureText(nativeShapingText(text));
          }
          return {text,font:ctx.font,direction:ctx.direction,left:Math.max(0,metrics.actualBoundingBoxLeft),
            ascent:Math.max(size*.75,metrics.actualBoundingBoxAscent),descent:Math.max(4,metrics.actualBoundingBoxDescent)};
        };
        const small=line(22),large=line(44);
        return {row,small,large,height:26+small.ascent+small.descent+12+large.ascent+large.descent+12};
      });
      canvas.width=1180;canvas.height=Math.ceil(specimens.reduce((sum,r)=>sum+r.height,40));
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.font='18px "Review Dad"';ctx.fillStyle='#111';ctx.fillText(`SOURCE STYLE — ${page+1} / ${total}`,18,26);
      let top=40;
      for(const [i,{row,small,large,height}] of specimens.entries()){
        ctx.fillStyle=i%2?'#f4f3ef':'#fff';ctx.fillRect(0,top,1180,height);ctx.fillStyle='#111';ctx.direction='ltr';ctx.textAlign='left';
        ctx.font='12px system-ui';ctx.fillText(`${row.index+1}. ${row.source.split('/').at(-1)} — ${row.role} — ${row.files} shard(s), ${row.contributed} contributed characters`,18,top+16);
        const baseline=top+26+small.ascent;
        ctx.font='22px "Review Dad"';ctx.fillText('BESIDE DAD:',18,baseline);
        for(const [line,y] of [[small,baseline],[large,baseline+small.descent+12+large.ascent]]){
          ctx.font=line.font;ctx.direction=line.direction;
          ctx.fillText(nativeShapingText(line.text),200+line.left,y);
        }
        top+=height;
      }
      document.querySelector('#page').textContent=`Page ${page+1} of ${total}`;
      document.querySelector('#previous').disabled=page===0;document.querySelector('#next').disabled=page===total-1;
      document.querySelector('#download').href=canvas.toDataURL('image/png');document.querySelector('#download').download=`source-style-${page+1}.png`;
      document.querySelector('#summary').textContent=`Ready: sources ${rows[0].index+1}–${rows.at(-1).index+1} of ${data.sources}; ${data.shards} shards in inventory; font errors ${errors.length}.`;
      history.replaceState(null,'',`?page=${page}`);
    }
    document.querySelector('#previous').onclick=async()=>{page--;await draw();};
    document.querySelector('#next').onclick=async()=>{page++;await draw();};
    await draw();
  </script>
